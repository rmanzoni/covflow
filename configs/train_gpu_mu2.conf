# -----------------------------
# Repository / environment
# -----------------------------
COVFLOW_REPO="/work/$USER/correct_track_covariance/covflow"          #! CONFIRM: is the repo here, or still under
                                            #! /work/manzoni/correct_track_covariance/covflow ?
COVFLOW_CONDA_ENV="covflow"                 #! CONFIRM: the env the GPU pilot actually activated

# -----------------------------
# Input ROOT files
# -----------------------------
#! CONFIRM: absolute paths. The interactive run used bare filenames, so these
#! resolved against the cwd. A batch job cds into COVFLOW_REPO, not into
#! wherever you launched from, so relative paths will silently pick up the
#! wrong file or fail.
COVFLOW_DATA="/pnfs/psi.ch/cms/trivcat/store/user/manzoni/rjpsi_run3/covflow_dimuon_ntuples_16sept26/dimuoun_run3_PARTIAL.root"
COVFLOW_MC="/pnfs/psi.ch/cms/trivcat/store/user/manzoni/rjpsi_run3/covflow_dimuon_ntuples_16sept26/hb_dimuon_2018_mc_PARTIAL.root"

COVFLOW_TREE="tree"
COVFLOW_COV_PREFIX="mu2_cov_"

# -----------------------------
# Covariance/context variables
# -----------------------------
COVFLOW_CONTEXT="mu2_pt mu2_eta mu2_n_pix_hit"
COVFLOW_LOG_PT="mu2_pt"

# -----------------------------
# Event weights
# -----------------------------
COVFLOW_DATA_WEIGHT=""
COVFLOW_MC_WEIGHT=""

# -----------------------------
# Training hyperparameters
# -----------------------------
# These are the ones train_gpu.sh puts on the command line directly.
# Do NOT repeat any of them in EXTRA_ARGS: argparse takes the LAST
# occurrence, so a duplicate there silently wins over the value here.
COVFLOW_EPOCHS=500
COVFLOW_BATCH_SIZE=8192        # train_covflow.py default; the interactive run used it
COVFLOW_LR="2e-3"              # train_covflow.py default
COVFLOW_TRANSFORMS=4           # default
COVFLOW_HIDDEN="128 128"       # default
COVFLOW_BINS=8                 # default
COVFLOW_SEED=0                 # overridden per array task by COVFLOW_SEEDS below

# One array task per seed.
COVFLOW_SEEDS=(0)
# COVFLOW_SEEDS=(0 1 2 3)      # independent retrainings, e.g. to size the noise floor

# -----------------------------
# Output
# -----------------------------
# Each array task writes everything -- pdfs, report.json, train.log, the
# checkpoints, and Slurm's own .out/.err -- to
#     ${COVFLOW_OUT_BASE}/task_<array index>
# with a seed_<seed> symlink alongside it. This replaces --out covflow_run2.
COVFLOW_OUT_BASE="/work/$USER/correct_track_covariance/covflow-runs/mu2_block_16sep26"

# -----------------------------
# Everything else from the interactive command
# -----------------------------
# --epochs, --seed, --batch-size, --lr, --transforms, --hidden, --bins,
# --device, --out, --data, --mc, --tree, --cov-prefix, --context, --log-pt
# are all added by train_gpu.sh. Only what is NOT in that list goes here.
EXTRA_ARGS=(
  --features block
  --patience 40
  --no-distill
  --max-events 100000
  --closure-bins 4,3,4
  --plot-bins 4,3,4
  --selection '(mu1_pt > 4.5) & (abs(mu1_eta) < 2.4) & (mu1_id_medium>0.5) & (mu2_id_medium>0.5) & (abs(mass-3.0969)<0.1) & ((lxy * cos2d /pt * 3.0969)>0.008)'
  --mc-selection '(abs(mu1_gen_pdgid)==13) & (abs(mu2_gen_pdgid)==13)'
)

# -----------------------------
# Slurm overrides (optional)
# -----------------------------
# Appended to the sbatch command line, so they override the #SBATCH directives
# in batch/train_gpu.sh. Leave empty until a job actually hits a limit.
# COVFLOW_SBATCH_ARGS="--time=12:00:00 --mem=32G"
