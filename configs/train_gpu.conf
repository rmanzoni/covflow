# ============================================================
# CovFlow training configuration
#
# This file is sourced by batch/train_gpu.sh.
# Edit this file rather than the Slurm script when changing
# physics/training parameters.
# ============================================================

# -----------------------------
# Repository / environment
# -----------------------------
COVFLOW_REPO="/work/$USER/covflow"
COVFLOW_CONDA_ENV="covflow"

# -----------------------------
# Input ROOT files
# -----------------------------
# Use shell globs if desired.
# Quote paths containing spaces.
COVFLOW_DATA="/work/manzoni/rjpsi_run3/CMSSW_16_0_8/src/Bmmm/Analysis/test/mm/crab/dimuon_2022C_nhits.root"
COVFLOW_MC="/work/manzoni/rjpsi_run3/CMSSW_16_0_8/src/Bmmm/Analysis/test/rjpsi/hb_covariance.root"

COVFLOW_TREE="tree"
COVFLOW_COV_PREFIX="mu1_cov_"

# -----------------------------
# Covariance/context variables
# -----------------------------
# train_gpu.sh expands these as separate command-line arguments.
COVFLOW_CONTEXT="mu1_pt mu1_eta mu1_n_pix_hit"

# Variable used for the optional log(pt) transformation.
COVFLOW_LOG_PT="mu1_pt"

# -----------------------------
# Event weights
# -----------------------------
# Leave empty if not used.
COVFLOW_DATA_WEIGHT=""
COVFLOW_MC_WEIGHT=""

# -----------------------------
# Training hyperparameters
# -----------------------------
COVFLOW_EPOCHS=2
COVFLOW_BATCH_SIZE=8192
COVFLOW_LR="2e-3"
COVFLOW_TRANSFORMS=4
COVFLOW_HIDDEN="128 128"
COVFLOW_BINS=8
COVFLOW_SEED=0

# -----------------------------
# Output
# -----------------------------
COVFLOW_OUT_BASE="/work/$USER/correct_track_covariance/covflow-runs"

# -----------------------------
# Optional extra arguments
# -----------------------------
# Put any additional train_covflow.py options here.
#
# Example:
EXTRA_ARGS=(
  --selection '(mu1_pt > 4.5) & (abs(mu1_eta) < 2.4) & (mu2_pt > 3.5) & (abs(mu2_eta) < 2.4) & (mu1_id_medium>0.5) & (mu2_id_medium>0.5) & (cos2d>0.9)'
  --data-selection '((abs(mass-3.0969)<0.1) & ((lxy * cos2d / pt * 3.0969)>0.012))'
  --mc-selection '((abs(jpsi_mass-3.0969)<0.1) & ((lxy * cos2d / pt * 3.0969)>0.010) & (abs(mu1_gen_pdgid)==13) & (abs(mu2_gen_pdgid)==13))'
  --closure-bins 8,5,2,2
  --reweight-bins 8,5,2,2
  --closure-min-count 500
  --plot-bins 8,5,2,2
  --epochs 300
  --seed 0
  --no-distill
  --no-onnx
  --max-events 20000
)
